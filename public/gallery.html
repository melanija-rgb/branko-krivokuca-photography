<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery — Branko Krivokuca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css?v=11" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">Branko Krivokuca</a>
      <nav id="site-nav">
        <a class="nav-mobile-only" href="/#categories" data-i18n="gallery">Gallery</a>
        <a class="nav-desktop-only" href="/gallery/landscape" data-i18n="landscape">Landscape</a>
        <a class="nav-desktop-only" href="/gallery/architecture" data-i18n="architecture">Architecture</a>
        <a class="nav-desktop-only" href="/gallery/wildlife" data-i18n="wildlife">Wildlife</a>
        <a class="nav-desktop-only" href="/gallery/people" data-i18n="people">People</a>
        <a href="/#social" data-i18n="social">Social</a>
        <a href="/#contact" data-i18n="contact">Contact</a>
      </nav>
      <div class="header-tools">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-label="English">
            <svg viewBox="0 0 60 30" aria-hidden="true">
              <rect width="60" height="30" fill="#012169" />
              <path d="M0 0 L60 30 M60 0 L0 30" stroke="#fff" stroke-width="6" />
              <path d="M0 0 L60 30 M60 0 L0 30" stroke="#C8102E" stroke-width="2" />
              <path d="M30 0 V30 M0 15 H60" stroke="#fff" stroke-width="10" />
              <path d="M30 0 V30 M0 15 H60" stroke="#C8102E" stroke-width="6" />
            </svg>
          </button>
          <button type="button" data-lang="sr" aria-label="Srpski">
            <svg viewBox="0 0 60 30" aria-hidden="true">
              <rect width="60" height="10" y="0" fill="#C6363C" />
              <rect width="60" height="10" y="10" fill="#0C4076" />
              <rect width="60" height="10" y="20" fill="#fff" />
            </svg>
          </button>
        </div>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          data-i18n-aria="openMenu"
          data-i18n-aria-open="closeMenu"
          aria-label="Open menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
      <section class="gallery-page">
        <div class="section-head">
          <p class="eyebrow"><a href="/#categories" data-i18n="gallery">Gallery</a></p>
          <h1 id="gallery-title">Landscape</h1>
        </div>
        <div id="category-gallery" class="gallery" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <ul class="facts">
        <li>📍 Banja Luka</li>
        <li data-i18n="factPortraits">📸 Portraits and events</li>
        <li data-i18n="factDm">📩 For photography services, send a DM</li>
      </ul>
      <p>© Branko Krivokuca</p>
    </footer>

    <dialog id="lightbox" class="lightbox">
      <div class="lightbox-frame">
        <img alt="" draggable="false" />
      </div>
      <form method="dialog"><button type="submit" data-i18n-aria="close" aria-label="Close" data-i18n="close">Close</button></form>
    </dialog>

    <script src="/js/i18n.js?v=2"></script>
    <script src="/js/site.js?v=16"></script>
  </body>
</html>
